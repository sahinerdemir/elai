<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="ss1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8ff00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8ff00" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Screen Background -->
  <rect width="1440" height="900" fill="url(#ss1bg)"/>

  <!-- Top App Navigation -->
  <rect width="1440" height="70" fill="#0d111a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="50" cy="35" r="16" fill="#c8ff00"/>
  <text x="50" y="41" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16" fill="#0a0a0a" text-anchor="middle">T</text>
  <text x="80" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Test Bank</text>
  
  <!-- Navigation Links -->
  <g transform="translate(300, 42)" font-family="'Inter', sans-serif" font-size="14">
    <text x="0" y="0" fill="#c8ff00" font-weight="600">Dashboard</text>
    <text x="120" y="0" fill="rgba(255,255,255,0.5)">Accounts</text>
    <text x="240" y="0" fill="rgba(255,255,255,0.5)">Transfers</text>
    <text x="360" y="0" fill="rgba(255,255,255,0.5)">Analytics</text>
    <text x="480" y="0" fill="rgba(255,255,255,0.5)">Settings</text>
  </g>

  <!-- Profile & Notification Area -->
  <rect x="1260" y="20" width="140" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="1280" cy="38" r="10" fill="#c8ff00"/>
  <text x="1300" y="43" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff">Lorem I.</text>

  <!-- Main Content Layout -->
  <!-- Left Side: Dashboard metrics -->
  <g transform="translate(60, 110)">
    <text x="0" y="30" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#ffffff">Financial Overview</text>
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</text>

    <!-- Stat Cards Row -->
    <g transform="translate(0, 90)">
      <!-- Card 1 -->
      <rect width="280" height="130" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="24" y="36" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Total Net Worth</text>
      <text x="24" y="78" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#ffffff">$284,920.50</text>
      <text x="24" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#c8ff00">+14.2% this month</text>

      <!-- Card 2 -->
      <rect x="304" width="280" height="130" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="328" y="36" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Monthly Income</text>
      <text x="328" y="78" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#ffffff">$32,450.00</text>
      <text x="328" y="106" font-family="'Inter', sans-serif" font-size="12" fill="#c8ff00">+8.5% vs avg</text>

      <!-- Card 3 -->
      <rect x="608" width="280" height="130" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="632" y="36" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Total Expenses</text>
      <text x="632" y="78" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#ffffff">$11,820.10</text>
      <text x="632" y="106" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">-3.1% below budget</text>
    </g>

    <!-- Chart Panel -->
    <g transform="translate(0, 250)">
      <rect width="888" height="360" rx="20" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
      <text x="30" y="45" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#ffffff">Cash Flow Analytics</text>
      <text x="30" y="70" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.4)">Quarterly projection &amp; real-time tracking</text>

      <!-- Chart grid lines -->
      <line x1="30" y1="120" x2="858" y2="120" stroke="rgba(255,255,255,0.04)"/>
      <line x1="30" y1="180" x2="858" y2="180" stroke="rgba(255,255,255,0.04)"/>
      <line x1="30" y1="240" x2="858" y2="240" stroke="rgba(255,255,255,0.04)"/>
      <line x1="30" y1="300" x2="858" y2="300" stroke="rgba(255,255,255,0.04)"/>

      <!-- Chart Curve -->
      <path d="M 60 280 Q 200 220 340 250 T 600 160 T 830 130 L 830 310 L 60 310 Z" fill="url(#chartGrad)"/>
      <path d="M 60 280 Q 200 220 340 250 T 600 160 T 830 130" fill="none" stroke="#c8ff00" stroke-width="3"/>

      <!-- Points -->
      <circle cx="340" cy="250" r="5" fill="#c8ff00"/>
      <circle cx="600" cy="160" r="5" fill="#c8ff00"/>
      <circle cx="830" cy="130" r="6" fill="#ffffff" stroke="#c8ff00" stroke-width="2"/>
    </g>
  </g>

  <!-- Right Side Panel: Quick Actions & Recent Transactions -->
  <g transform="translate(980, 110)">
    <rect width="400" height="660" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="30" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#ffffff">Recent Transactions</text>

    <!-- Transaction 1 -->
    <g transform="translate(30, 80)">
      <circle cx="20" cy="20" r="20" fill="rgba(200,255,0,0.1)"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" fill="#c8ff00" text-anchor="middle">↑</text>
      <text x="56" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Lorem Capital Transfer</text>
      <text x="56" y="36" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Oct 04, 2026 · Wire</text>
      <text x="340" y="26" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#c8ff00" text-anchor="end">+$12,500.00</text>
    </g>

    <!-- Transaction 2 -->
    <g transform="translate(30, 155)">
      <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.05)"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">↓</text>
      <text x="56" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Cloud Infrastructure</text>
      <text x="56" y="36" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Oct 03, 2026 · Subscription</text>
      <text x="340" y="26" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">-$840.00</text>
    </g>

    <!-- Transaction 3 -->
    <g transform="translate(30, 230)">
      <circle cx="20" cy="20" r="20" fill="rgba(200,255,0,0.1)"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" fill="#c8ff00" text-anchor="middle">↑</text>
      <text x="56" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Client Invoice #8042</text>
      <text x="56" y="36" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Oct 01, 2026 · Direct Deposit</text>
      <text x="340" y="26" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#c8ff00" text-anchor="end">+$4,200.00</text>
    </g>

    <!-- Transaction 4 -->
    <g transform="translate(30, 305)">
      <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.05)"/>
      <text x="20" y="25" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">↓</text>
      <text x="56" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Office Headquarters Lease</text>
      <text x="56" y="36" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">Sep 28, 2026 · ACH</text>
      <text x="340" y="26" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">-$3,150.00</text>
    </g>

    <!-- Virtual Card Mini -->
    <g transform="translate(30, 420)">
      <rect width="340" height="190" rx="16" fill="#151b26" stroke="#c8ff00" stroke-width="1" stroke-opacity="0.3"/>
      <text x="24" y="40" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#c8ff00">TEST BANK VIRTUAL</text>
      <text x="24" y="95" font-family="monospace" font-size="16" fill="#ffffff" letter-spacing="3">••••  ••••  ••••  9012</text>
      <text x="24" y="145" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">CARDHOLDER</text>
      <text x="24" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#ffffff" font-weight="600">LOREM IPSUM</text>
      <text x="316" y="165" font-family="'Inter', sans-serif" font-size="13" fill="#c8ff00" font-weight="700" text-anchor="end">ACTIVE</text>
    </g>
  </g>
</svg>
