<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="g3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#g3bg)"/>

  <!-- Analytics & Portfolio Breakdown Graphic -->
  <g transform="translate(150, 160)">
    <!-- Container -->
    <rect width="900" height="420" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Header -->
    <text x="40" y="55" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#ffffff">Treasury Allocation &amp; Liquidity</text>
    <text x="40" y="82" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Automated yield management and treasury operations</text>

    <!-- Donut Chart representation -->
    <g transform="translate(200, 250)">
      <circle cx="0" cy="0" r="100" fill="none" stroke="#222a38" stroke-width="32"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#c8ff00" stroke-width="32" stroke-dasharray="320 628" stroke-dashoffset="0"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="#00f0ff" stroke-width="32" stroke-dasharray="180 628" stroke-dashoffset="-330"/>
      <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">58%</text>
      <text x="0" y="28" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">LIQUID</text>
    </g>

    <!-- Legend & Breakdown rows -->
    <g transform="translate(420, 140)">
      <rect y="0" width="420" height="70" rx="12" fill="rgba(255,255,255,0.02)"/>
      <circle cx="25" cy="35" r="8" fill="#c8ff00"/>
      <text x="45" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">High-Yield Treasury Reserves</text>
      <text x="45" y="52" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">58% · $1,420,000.00</text>
      <text x="390" y="42" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#c8ff00" text-anchor="end">+5.2% APY</text>

      <rect y="85" width="420" height="70" rx="12" fill="rgba(255,255,255,0.02)"/>
      <circle cx="25" cy="120" r="8" fill="#00f0ff"/>
      <text x="45" y="117" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Working Capital Account</text>
      <text x="45" y="137" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">28% · $685,000.00</text>
      <text x="390" y="127" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">Daily settlement</text>

      <rect y="170" width="420" height="70" rx="12" fill="rgba(255,255,255,0.02)"/>
      <circle cx="25" cy="205" r="8" fill="#a78bfa"/>
      <text x="45" y="202" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff">Hedging &amp; Forex Reserves</text>
      <text x="45" y="222" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)">14% · $340,000.00</text>
      <text x="390" y="212" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">Multi-currency</text>
    </g>
  </g>

  <text x="600" y="690" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Corporate Treasury Management</text>
  <text x="600" y="725" font-family="'Inter', sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Gallery Placeholder 03 · Real-time Reporting</text>
</svg>
